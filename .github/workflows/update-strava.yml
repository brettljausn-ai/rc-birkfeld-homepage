name: Strava-Daten aktualisieren

on:
  schedule:
    # Jeden Montag um 06:00 UTC (= 07:00 oder 08:00 CEST)
    - cron: '0 6 * * 1'
  workflow_dispatch: # auch manuell auslösbar

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Strava-Daten holen & HTML aktualisieren
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: node scripts/update-strava.js

      - name: Änderungen committen (falls vorhanden)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: Strava-Mitgliederzahl aktualisiert"
          git push
