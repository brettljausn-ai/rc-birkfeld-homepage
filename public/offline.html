<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline – RC Birkfeld</title>
<link rel="icon" type="image/png" href="/images/rcbirkfeld-logo.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0D0D0D;color:#E8E8E8;font-family:'Public Sans',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .logo{width:64px;height:64px;margin-bottom:24px;opacity:.8;}
  h1{font-size:1.6rem;font-weight:900;letter-spacing:.02em;margin-bottom:10px;}
  p{color:#555;font-size:0.92rem;line-height:1.6;max-width:300px;margin-bottom:28px;}
  .btn{display:inline-block;background:#1F7A34;color:#fff;padding:12px 28px;border-radius:8px;font-weight:700;font-size:0.9rem;text-decoration:none;cursor:pointer;border:none;}
  .btn:hover{background:#2a9a44;}
  .signal{margin-top:40px;display:flex;align-items:flex-end;gap:4px;height:28px;}
  .bar{width:6px;border-radius:2px;background:#222;}
  .bar:nth-child(1){height:8px;}
  .bar:nth-child(2){height:14px;}
  .bar:nth-child(3){height:20px;}
  .bar:nth-child(4){height:28px;background:#333;}
</style>
</head>
<body>
  <img src="/images/rcbirkfeld-logo.png" class="logo" alt="RC Birkfeld">
  <h1>Kein Internet</h1>
  <p>Du bist gerade offline. Sobald die Verbindung wieder steht, geht's weiter.</p>
  <button class="btn" onclick="location.reload()">Nochmal versuchen</button>
  <div class="signal">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</body>
</html>
